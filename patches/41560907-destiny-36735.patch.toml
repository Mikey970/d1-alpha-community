[[patch]]
name = "Apply local Alpha ownership to the offer proof-of-ownership requirement"
desc = "Both investment:offer paths test the selected offer's proof key with 0x82B32068, which compares it against the locally registered type-5 Alpha record found by 0x82B31940. Under emulation there is no marketplace package layer to merge that entitlement, so the comparison fails and the activity UI reopens the PROOF OF OWNERSHIP card instead of taking its direct-invoke path. Replacing the truncation of the result at both sites with a literal 1 reports the requirement as satisfied. Pairs with the server's 0x16 purchased-offers response, which reports owned-content index 0."
author = "Local reverse-engineering trace"
is_enabled = true



